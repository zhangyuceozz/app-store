<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应用商店</title>
<meta name="description" content="免费的小工具，支持 Windows 与 macOS。">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://chovy.cc.cd" crossorigin>
<link rel="dns-prefetch" href="https://chovy.cc.cd">
<script>
  (function () {
    try {
      var t = localStorage.getItem("store-theme") || "auto";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@500;600&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@500;600&family=Inter:wght@400;500;600&display=swap"></noscript>
<style>
  :root {
    /* 色彩体系 */
    --bg: #f3f3f3;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #5d5d5d;
    --line: #e5e5e5;
    --soft: #f5f5f5;
    --accent: #f5491f;
    --accent-deep: #d93a12;
    /* 阴影令牌（4级） */
    --s-1: 0 1px 2px rgba(0,0,0,.04);
    --s-2: 0 2px 8px rgba(0,0,0,.07);
    --s-3: 0 6px 20px -6px rgba(0,0,0,.14);
    --s-4: 0 16px 40px -8px rgba(0,0,0,.2);
    /* 字体栈 */
    --sans: "Segoe UI Variable Text", "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI Semibold", "Segoe UI", "Archivo Expanded", "Inter", var(--sans);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #0b0b0b;
    --card: #1b1b1b;
    --ink: #ffffff;
    --muted: #808080;
    --line: #2a2a2a;
    --soft: #161616;
    --s-1: 0 1px 2px rgba(0,0,0,.3);
    --s-2: 0 2px 8px rgba(0,0,0,.35);
    --s-3: 0 6px 20px -6px rgba(0,0,0,.5);
    --s-4: 0 16px 40px -8px rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="auto"] {
      --bg: #0b0b0b;
      --card: #1b1b1b;
      --ink: #ffffff;
      --muted: #808080;
      --line: #2a2a2a;
      --soft: #161616;
      --s-1: 0 1px 2px rgba(0,0,0,.3);
      --s-2: 0 2px 8px rgba(0,0,0,.35);
      --s-3: 0 6px 20px -6px rgba(0,0,0,.5);
      --s-4: 0 16px 40px -8px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .25s ease, color .25s ease;
    overflow-x: hidden;
    scroll-behavior: smooth;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.18) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.28); border: 3px solid transparent; background-clip: padding-box; }
  header, main { position: relative; z-index: 1; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 0 48px; }

  /* ---------- 顶栏 ---------- */
  header { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid transparent; transition: background .3s ease, border-color .3s ease, box-shadow .4s ease; }
  header.scrolled { background: var(--bg); border-bottom-color: var(--line); box-shadow: 0 1px 0 rgba(0,0,0,.03); }

  .top { display: flex; align-items: center; height: 76px; gap: 24px; }

  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    flex-shrink: 0; user-select: none;
    padding: 8px 14px; border-radius: 12px;
    position: relative;
    cursor: pointer;
    isolation: isolate;
    overflow: hidden;
  }
  .brand::before {
    content: "";
    position: absolute; inset: -40px; z-index: -1;
    background: radial-gradient(80px 80px at var(--brand-x, 50%) var(--brand-y, 50%),
      color-mix(in srgb, var(--ink) 12%, transparent) 0%,
      transparent 60%);
    opacity: 0; transition: opacity .25s ease;
    pointer-events: none;
  }
  .brand:hover::before { opacity: 1; }
  .brand::after {
    content: "";
    position: absolute; inset: 0; z-index: -2;
    border-radius: inherit;
    background: radial-gradient(120px 80px at var(--brand-x, 50%) var(--brand-y, 50%),
      color-mix(in srgb, var(--accent) 10%, transparent) 0%,
      transparent 55%);
    opacity: 0; transition: opacity .3s ease;
    pointer-events: none;
  }
  .brand:hover::after { opacity: 1; }
  .brand-logo {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover; display: block; border: 1px solid var(--line);
    transition: transform .35s cubic-bezier(.22,1,.36,1);
    will-change: transform;
  }
  .brand:hover .brand-logo { transform: scale(1.08); }
  .brand-name { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 0; white-space: nowrap; color: var(--ink); }

  /* ---------- 平台选择：拟物拨杆（Uiverse by Yaya12085 · 左下角固定） ---------- */
  .plat-wrap {
    position: fixed; left: 20px; bottom: 20px; z-index: 60;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  }
  .plat-note {
    display: flex; flex-direction: column; gap: 2px;
    font-size: 12px; line-height: 1.3; white-space: nowrap;
    color: var(--muted);
    text-align: left; padding: 0 2px;
  }
  .plat-note-title { font-weight: 600; letter-spacing: 0.02em; }
  .plat-note-now { font-size: 11.5px; color: var(--muted); }
  .psw { display: inline-block; flex-shrink: 0; }
  .psw #plat-toggle { display: none; }
  .psw .label {
    height: 60px; width: 120px;
    background-color: #ffffff;
    border-radius: 30px;
    box-shadow: inset 0 0 4px 3px rgba(255,255,255,1), inset 0 0 14px 1px rgba(0,0,0,0.44),
      8px 14px 22px rgba(0,0,0,0.096), inset 0 0 0 2px rgba(0,0,0,0.28);
    display: flex; align-items: center;
    cursor: pointer; position: relative;
    transition: transform 0.4s;
  }
  .psw .label:hover { transform: perspective(100px) rotateX(5deg) rotateY(-5deg); }
  #plat-toggle:checked ~ .label:hover { transform: perspective(100px) rotateX(-5deg) rotateY(5deg); }
  .psw .label::before {
    position: absolute; content: "";
    height: 40px; width: 40px; border-radius: 50%;
    background-color: #000000;
    background-image: linear-gradient(130deg, #757272 10%, #ffffff 11%, #726f6f 62%);
    left: 10px;
    box-shadow: 0 2px 1px rgba(0,0,0,0.3), 10px 10px 12px rgba(0,0,0,0.3);
    transition: 0.4s;
  }
  #plat-toggle:checked ~ .label::before {
    left: 70px;
    background-color: #000000;
    background-image: linear-gradient(315deg, #000000 0%, #414141 70%);
    transition: 0.4s;
  }
  .p-icons {
    position: absolute; left: 10px; top: 50%;
    width: 40px; height: 40px;
    transform: translateY(-50%);
    transition: left 0.4s;
    pointer-events: none;
    z-index: 1;
  }
  #plat-toggle:checked ~ .label .p-icons { left: 70px; }
  .pi {
    position: absolute; inset: 0;
    margin: auto;
    width: 24px; height: 24px;
    transition: opacity 0.3s, transform 0.3s;
  }
  .pi-win { opacity: 1; transform: scale(1) rotate(0deg); }
  #plat-toggle:checked ~ .label .pi-win { opacity: 0; transform: scale(0.4) rotate(90deg); }
  .pi-mac { opacity: 0; transform: scale(0.4) rotate(-90deg); }
  #plat-toggle:checked ~ .label .pi-mac { opacity: 1; transform: scale(1) rotate(0deg); }
  [data-theme="dark"] .psw .label {
    background-color: #26241f;
    box-shadow: inset 0 0 4px 3px rgba(0,0,0,.5), inset 0 0 14px 1px rgba(0,0,0,.6),
      8px 14px 22px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.12);
  }
  @media (prefers-color-scheme: dark) {
    [data-theme="auto"] .psw .label {
      background-color: #26241f;
      box-shadow: inset 0 0 4px 3px rgba(0,0,0,.5), inset 0 0 14px 1px rgba(0,0,0,.6),
        8px 14px 22px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.12);
    }
  }

  /* ---------- 搜索框（浮动标签） ---------- */
  .search { flex: 1; min-width: 0; position: relative; max-width: 600px; margin: 0 auto; }
  .search input {
    background: transparent; border: 0; border-bottom: 2px solid var(--line);
    display: block; width: 100%; padding: 15px 0 7px;
    font-size: 15.5px; color: var(--ink); font-family: inherit; outline: none;
    transition: border-color .3s ease;
  }
  .search input:focus, .search input:valid { border-bottom-color: var(--accent); }
  .search label {
    position: absolute; top: 14px; left: 0; pointer-events: none;
  }
  .search label span {
    display: inline-block; font-size: 15.5px; color: var(--muted);
    transition: .3s cubic-bezier(.68,-.55,.265,1.55);
  }
  .search input:focus + label span,
  .search input:valid + label span {
    color: var(--accent); transform: translateY(-27px); font-size: 11.5px; font-weight: 550;
  }

  /* ---------- 主题切换按钮（日/夜，Uiverse Glassmorphism） ---------- */
  .theme-switch {
    --toggle-size: 13px;
    --container-width: 5.625em;
    --container-height: 2.5em;
    --container-radius: 0.38em;
    --container-light-bg: #5caad4;
    --container-night-bg: #1b1e36;
    --circle-container-diameter: 3.375em;
    --sun-moon-diameter: 2.125em;
    --sun-bg: #f5c518;
    --moon-bg: #d8d4c0;
    --spot-color: #9b9787;
    --circle-container-offset: calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);
    --clouds-color: #f4f4f4;
    --back-clouds-color: #bacfe0;
    --transition: 0.5s cubic-bezier(0, -0.02, 0.4, 1.25);
    --circle-transition: 0.3s cubic-bezier(0, -0.02, 0.35, 1.17);
    display: inline-block; flex-shrink: 0;
  }
  .theme-switch, .theme-switch *, .theme-switch *::before, .theme-switch *::after {
    box-sizing: border-box; margin: 0; padding: 0; font-size: var(--toggle-size);
  }
  .theme-switch__container {
    width: var(--container-width); height: var(--container-height);
    background-color: var(--container-light-bg);
    border-radius: var(--container-radius);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: background-color var(--transition);
  }
  .theme-switch__checkbox { display: none; }
  .theme-switch__circle-container {
    position: absolute;
    top: var(--circle-container-offset);
    left: 0;
    width: var(--circle-container-diameter);
    height: var(--circle-container-diameter);
    border-radius: 50%;
    background: linear-gradient(145deg, var(--sun-bg), #f78c1e);
    box-shadow: 0 0 0.5em 0.125em rgba(255, 200, 40, 0.4), 0 0 1em 0.25em rgba(255, 160, 60, 0.3);
    transition: transform var(--circle-transition), background var(--transition), box-shadow var(--transition);
    z-index: 2;
  }
  .theme-switch__circle-container::before {
    content: "";
    position: absolute;
    left: -0.75em; top: 25%;
    width: 1.5em; height: 1.5em;
    border-radius: 50%;
    background: var(--clouds-color);
    box-shadow: 0.5em 0.5em 0 0.25em var(--clouds-color), -0.5em -0.25em 0 0 var(--clouds-color), -0.25em 0.75em 0 0.125em rgba(0,0,0,0.05);
    transition: opacity var(--circle-transition);
  }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container::before { opacity: 0; }
  .theme-switch__sun-moon-container {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--sun-moon-diameter); height: var(--sun-moon-diameter);
    margin: calc(var(--sun-moon-diameter) / -2) 0 0 calc(var(--sun-moon-diameter) / -2);
    border-radius: 50%;
    overflow: hidden;
  }
  .theme-switch__moon {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, var(--moon-bg), #cbb89d);
    border-radius: 50%;
    position: absolute;
    transform: translateX(-100%) rotate(-30deg);
    transition: transform var(--circle-transition);
  }
  .theme-switch__spot {
    position: absolute;
    top: 20%; left: 30%;
    width: 27%; height: 27%;
    border-radius: 50%;
    background: var(--spot-color);
  }
  .theme-switch__spot:nth-of-type(2) { width: 0.375em; height: 0.375em; top: 0.937em; left: 1.375em; }
  .theme-switch__spot:nth-last-of-type(3) { width: 0.25em; height: 0.25em; top: 0.312em; left: 0.812em; }
  .theme-switch__clouds {
    position: absolute; right: 0; bottom: 0;
    width: 2.5em; height: 2.5em;
    border-radius: 50%;
    background: var(--back-clouds-color);
    box-shadow: -0.625em -0.3125em 0 0.3125em var(--clouds-color), -1.25em -0.1875em 0 0.125em var(--clouds-color), -1.875em -0.3125em 0 0 var(--clouds-color);
    transition: transform var(--transition), bottom var(--transition);
    z-index: 1;
  }
  .theme-switch__stars-container {
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%; height: 100%;
    transition: top var(--transition);
    z-index: 0;
  }
  .theme-switch__checkbox:checked + .theme-switch__container { background-color: var(--container-night-bg); }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container {
    transform: translateX(calc(var(--container-width) - var(--circle-container-diameter)));
    background: linear-gradient(145deg, var(--moon-bg), #c7b7a4);
    box-shadow: 0 0 0.5em 0.125em rgba(216, 212, 192, 0.2);
  }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__moon { transform: translate(0); }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__clouds { bottom: -4.062em; }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-container { top: 50%; transform: translateY(-50%); }
  .theme-switch__container:hover .theme-switch__clouds { transform: translateX(8px) scale(1.02); }
  .theme-switch__shooting-star { position: absolute; width: 2px; height: 2px; background: white; top: 20%; left: -10%; opacity: 0; transition: opacity 0.3s ease; }
  .theme-switch__shooting-star-2 { position: absolute; width: 1px; height: 1px; background: white; top: 35%; left: -10%; opacity: 0; transition: opacity 0.3s ease; }
  .theme-switch__meteor { position: absolute; width: 3px; height: 3px; background: #ffd700; border-radius: 50%; top: -10%; left: 50%; opacity: 0; filter: blur(1px); transition: opacity 0.3s ease; }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__shooting-star { animation: shootingStar 2s linear infinite; opacity: 1; }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__shooting-star-2 { animation: shootingStar 3s linear infinite 1s; opacity: 1; }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__meteor { animation: meteor 4s linear infinite 2s; opacity: 1; }
  @keyframes shootingStar { 0% { transform: translateX(0) translateY(0) rotate(45deg); opacity: 1; } 100% { transform: translateX(80px) translateY(80px) rotate(45deg); opacity: 0; } }
  @keyframes meteor { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(80px) scale(0.3); opacity: 0; } }
  .theme-switch__stars-cluster { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s ease; }
  .theme-switch__stars-cluster .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; box-shadow: 0 0 4px 1px white; }
  .theme-switch__stars-cluster .star:nth-child(1) { top: 20%; left: 20%; animation: twinkle 1s infinite ease-in-out; }
  .theme-switch__stars-cluster .star:nth-child(2) { top: 30%; left: 55%; animation: twinkle 1s infinite ease-in-out 0.3s; }
  .theme-switch__stars-cluster .star:nth-child(3) { top: 40%; left: 80%; animation: twinkle 1s infinite ease-in-out 0.6s; }
  .theme-switch__stars-cluster .star:nth-child(4) { top: 60%; left: 30%; animation: twinkle 1s infinite ease-in-out 0.9s; }
  .theme-switch__stars-cluster .star:nth-child(5) { top: 70%; left: 65%; animation: twinkle 1s infinite ease-in-out 1.2s; }
  .theme-switch__aurora { position: absolute; top: 0; left: 0; right: 0; height: 20px; background: linear-gradient(90deg, rgba(0,255,255,0) 0%, rgba(0,255,255,0.2) 25%, rgba(128,0,255,0.2) 50%, rgba(0,255,255,0.2) 75%, rgba(0,255,255,0) 100%); opacity: 0; filter: blur(4px); transform: translateY(-100%); transition: opacity 0.3s ease; }
  .theme-switch__comets { position: absolute; inset: 0; overflow: hidden; opacity: 0; transition: opacity 0.3s ease; }
  .theme-switch__comets .comet { position: absolute; width: 2px; height: 2px; background: linear-gradient(90deg, white 0%, transparent 90%); border-radius: 50%; filter: blur(1px); }
  .theme-switch__comets .comet:nth-child(1) { top: 30%; left: -10%; animation: cometMove 4s linear infinite; }
  .theme-switch__comets .comet:nth-child(2) { top: 50%; left: -10%; animation: cometMove 6s linear infinite 2s; }
  @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
  @keyframes cometMove { 0% { transform: translateX(0) translateY(0) rotate(-45deg) scale(1); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(120px) translateY(120px) rotate(-45deg) scale(0.2); opacity: 0; } }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-cluster { opacity: 1; }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__aurora { opacity: 1; animation: auroraWave 8s linear infinite; }
  .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__comets { opacity: 1; }
  @keyframes auroraWave { 0% { transform: translateY(-100%) translateX(-50%); } 100% { transform: translateY(-100%) translateX(50%); } }

  main.wrap { padding: 0 0 140px; display: flex; gap: 32px; align-items: flex-start; }
  main.wrap section { flex: 1; min-width: 0; padding-top: 16px; }
  .side {
    width: 130px; flex-shrink: 0;
    position: sticky; top: 76px;
    align-self: flex-start;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding-right: 8px;
  }

  /* ===== React Bits BranchedMenu — 完整 CSS（按源码 1:1） ===== */
  .branched-menu {
    --bm-w: 130px;
    --bm-ink: var(--ink);
    --bm-accent: var(--ink);
    --bm-line: var(--bm-line, #d4d4d8);
    --bm-font: 13px;
    --bm-row: 42px;
    --bm-indent: 32px;
    --bm-line-w: 1.5;
    --bm-draw: 400ms;
    --bm-fold: 300ms;
    --bm-ease-out: ease;
    --bm-muted: var(--muted);

    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: min(var(--bm-w), 100%);
    padding-left: 14px;
    padding-right: 14px;
    color: var(--bm-ink);
    font-family: inherit;
    font-size: var(--bm-font);
    line-height: 1.2;
  }
  @media (prefers-color-scheme: dark) {
    .branched-menu { --bm-line: #3f3f46; --bm-accent: var(--ink); }
  }

  .branched-menu::before {
    content: '';
    position: absolute;
    top: 8px;
    bottom: 0;
    left: 0;
    width: 2px;
    border-radius: 1px;
    background: var(--bm-line);
  }

  .branched-menu__marker {
    position: absolute;
    top: -1px;
    left: 0;
    z-index: 1;
    width: 2px;
    height: 16px;
    border-radius: 1px;
    background: var(--bm-accent);
    opacity: 0;
    transition: top 220ms ease, opacity 150ms ease;
  }
  .branched-menu__marker[data-on] { opacity: 1; }

  .branched-menu__section { display: flex; flex-direction: column; }

  .branched-menu__head {
    display: block; margin: 0;
    padding: 9px 0;
    border: 0; background: none;
    color: var(--bm-muted);
    font: inherit; font-size: calc(var(--bm-font) + 1px); font-weight: 500;
    text-align: left; cursor: pointer; outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 200ms ease;
  }
  .branched-menu__section[data-open] .branched-menu__head,
  .branched-menu__head[data-active] { color: var(--bm-ink); }
  @media (hover: hover) and (pointer: fine) {
    .branched-menu__head:hover { color: var(--bm-ink); }
  }

  .branched-menu__body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--bm-fold) var(--bm-ease-out);
  }
  .branched-menu__section[data-open] .branched-menu__body { grid-template-rows: 1fr; }

  .branched-menu__fold { min-height: 0; overflow: hidden; }

  .branched-menu__tree { position: relative; padding: 6px 0; box-sizing: border-box; }

  .branched-menu__lines {
    position: absolute; top: 0; left: 0;
    overflow: visible;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .branched-menu__section[data-open] .branched-menu__lines {
    opacity: 1;
    transition: opacity 250ms ease 100ms;
  }

  .branched-menu__base,
  .branched-menu__reach {
    fill: none;
    stroke-width: var(--bm-line-w);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .branched-menu__base { stroke: var(--bm-line); }
  .branched-menu__reach {
    stroke: var(--bm-accent);
    transition: stroke-dashoffset var(--bm-draw) var(--bm-ease-out);
  }

  .branched-menu__item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: var(--bm-row);
    margin: 0; padding: 0 0 0 var(--bm-indent);
    border: 0; background: none;
    color: var(--bm-muted);
    font: inherit; text-align: left; cursor: pointer;
    outline: none; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    transition: color 200ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .branched-menu__item:hover { color: var(--bm-ink); }
  }
  .branched-menu__item[data-active] {
    color: var(--bm-accent); font-weight: 500;
  }

  .branched-menu__label { white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .branched-menu__marker { transition: opacity 150ms ease; }
    .branched-menu__body { transition: none; }
    .branched-menu__reach { transition: none; }
  }

  @media (max-width: 720px) {
    main.wrap { flex-direction: column; gap: 24px; }
    .side { width: 100%; position: static; }
  }

  .group-title { font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: 0; margin: 28px 0 16px; display: flex; align-items: center; gap: 8px; }
  .group-title:first-child { margin-top: 0; }
  .group-title .gt-count { font-family: var(--mono); font-size: 11.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; display: inline-block; transition: transform .2s ease; }
  .group-title::after { content: "\203A"; color: var(--muted); font-size: 22px; font-weight: 400; margin-left: 4px; line-height: 1; }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; overflow: visible; align-items: stretch; perspective: 900px; }

  /* Sentinel + loading dots */
  .sentinel { display: flex; justify-content: center; align-items: center; padding: 28px 0 16px; min-height: 40px; }
  .load-dots { display: flex; gap: 6px; }
  .load-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); opacity: .4; }

  .card {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; cursor: pointer; overflow: hidden;
    min-height: 0;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow: var(--s-1);
    transform-style: preserve-3d;
  }
  /* TiltedCard layers (React Bits style) */
  .card__shadow {
    position: absolute; inset: 0; margin: auto;
    max-width: 100%; max-height: 100%;
    background: rgba(0,0,0,.55);
    filter: blur(20px); opacity: 0; pointer-events: none;
    will-change: transform, opacity;
  }
  .card__glare {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(
      farthest-corner circle at var(--tc-gx,50%) var(--tc-gy,50%),
      rgba(255,255,255,calc(var(--tc-glare,0)*0.34)) 0%,
      rgba(255,255,255,calc(var(--tc-glare,0)*0.202)) 27%,
      rgba(255,255,255,calc(var(--tc-glare,0)*0.003)) 54%,
      rgba(255,255,255,0) 60%);
    mix-blend-mode: screen;
  }
  .card__rim {
    position: absolute; inset: 0; z-index: 6;
    border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .card__edge {
    position: absolute; inset: 0; z-index: 7;
    box-sizing: border-box; padding: 1px; border-radius: inherit; pointer-events: none;
    background: radial-gradient(
      farthest-side circle at var(--tc-gx,50%) var(--tc-gy,50%),
      rgba(255,255,255,calc(var(--tc-glare,0)*0.85)) 0%,
      rgba(255,255,255,calc(var(--tc-glare,0)*0.43)) 36%,
      rgba(255,255,255,calc(var(--tc-glare,0)*0.02)) 72%,
      rgba(255,255,255,0) 85%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }
  .card[data-tc] { isolation: isolate; overflow: visible; }
  .card[data-tc] .c-preview img,
  .card[data-tc] .c-icon,
  .card[data-tc] .c-name,
  .card[data-tc] .c-meta,
  .card[data-tc] .c-date,
  .card[data-tc] .c-dl-btn {
    transform: translate3d(
      calc(var(--tc-px,0) * var(--tc-depth,0) * 1px),
      calc(var(--tc-py,0) * var(--tc-depth,0) * 1px), 0);
  }
  .card[data-tc] .c-preview { --tc-depth: -24; }
  .card[data-tc] .c-icon    { --tc-depth: 6; }
  .card[data-tc] .c-name    { --tc-depth: 4; }
  .card[data-tc] .c-meta    { --tc-depth: 3; }
  .card[data-tc] .c-dl-btn  { --tc-depth: 12; }



  /* 预览图骨架 */
  .card .c-preview { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; background: var(--soft); margin-bottom: 4px; cursor: zoom-in; }
  .card .c-preview img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .25s ease; opacity: 0; }
  .card .c-preview img.loaded { opacity: 1; }
  .card:hover .c-preview img { transform: none; }
  .card .c-preview-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.5)); color: #fff; font-size: 11px; font-weight: 600; letter-spacing: .06em; opacity: 0; transition: opacity .22s ease; pointer-events: none; }
  .card .c-preview-hint svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2; }
  .card:hover .c-preview-hint { opacity: 1; }

  /* 默认内容：hover 时模糊淡出 */
  .card .c-row { display: flex; align-items: center; gap: 10px; transition: opacity .2s ease; }
  .card:hover .c-row { opacity: .28; }
  .card .c-icon { width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; border: 1px solid var(--line); }
  .card .c-icon.avatar { background: var(--soft); border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; font-size: 18px; font-weight: 600; }
  .card .c-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .card .c-name { font-family: var(--display); font-size: 14px; font-weight: 600; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .c-meta-row { display: flex; align-items: center; gap: 6px; }
  .card .c-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .card .c-date {
    display: inline-flex; flex-direction: column; align-items: flex-end; gap: 1px;
    font-size: 10px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 7px; border-radius: 8px; line-height: 1.2;
    background: var(--soft); border: 1px solid var(--line);
    white-space: nowrap; flex-shrink: 0;
    transition: color .3s ease, border-color .3s ease, background .3s ease;
    font-variant-numeric: tabular-nums;
  }
  .card .c-date__sub {
    font-size: 8px; font-weight: 600;
    color: var(--accent);
    letter-spacing: .02em;
    opacity: 0;
    transition: opacity .25s ease;
    line-height: 1;
  }

  .card .c-date[data-fresh="brand-new"] .c-date__sub { opacity: 1; }

  /* 7 档新鲜度颜色（应用卡片 + 日志卡片共用） */
  .card .c-date[data-fresh="brand-new"],  .log-date[data-fresh="brand-new"]  { color: var(--accent);    border-color: var(--line); background: var(--soft); }
  .card .c-date[data-fresh="coral"],      .log-date[data-fresh="coral"]      { color: #ef4444;          border-color: var(--line); background: var(--soft); }
  .card .c-date[data-fresh="tangerine"],  .log-date[data-fresh="tangerine"]  { color: #ea580c;          border-color: var(--line); background: var(--soft); }
  .card .c-date[data-fresh="sky"],        .log-date[data-fresh="sky"]        { color: #3b82f6;          border-color: var(--line); background: var(--soft); }
  .card .c-date[data-fresh="deep-blue"],  .log-date[data-fresh="deep-blue"]  { color: #1e40af;          border-color: var(--line); background: var(--soft); }
  .card .c-date[data-fresh="slate"],      .log-date[data-fresh="slate"]      { color: #64748b;          border-color: var(--line); background: var(--soft); }
  .card .c-date[data-fresh="ink-muted"],  .log-date[data-fresh="ink-muted"]  { color: var(--muted);     border-color: var(--line);                                           background: transparent; }

  /* 获取按钮：卡片底部，hover 时显示 */
  .card .c-dl-btn { display: block; width: 100%; padding: 6px 10px; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; cursor: pointer; margin-top: auto; opacity: 0; pointer-events: none; transition: opacity .2s ease-out, transform .2s ease-out; }
  .card:hover .c-dl-btn { opacity: 1; pointer-events: auto; }

  /* ---------- 弹窗 ---------- */
  .modal { display: none; position: fixed; inset: 0; z-index: 100; }
  .modal.open { display: block; }
  .modal .backdrop { position: absolute; inset: 0; background: rgba(10, 10, 12, 0.4); }
  .modal .panel { position: relative; z-index: 1; max-width: 580px; margin: 7vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 44px 46px; max-height: 86vh; overflow-y: auto; overscroll-behavior: contain; box-shadow: var(--s-4); perspective: 900px; }
  .modal .close { position: absolute; top: 24px; right: 24px; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; transition: all .25s ease; }
  .modal .close:hover { color: var(--ink); border-color: var(--ink); }
  .modal .head { display: flex; align-items: center; gap: 22px; }
  .modal .head img, .modal .head .avatar { width: 72px; height: 72px; border-radius: 19px; }
  .modal .head .avatar { background: var(--soft); border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; font-size: 28px; font-weight: 600; }
  .modal .head .m-name { font-family: var(--display); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15; }
  .modal .head .m-sub { font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .modal .desc { margin-top: 28px; font-size: 15.5px; line-height: 1.8; color: var(--muted); }
  .modal .sec { margin-top: 38px; }
  .modal .sec h4 { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.12em; margin-bottom: 16px; }
  .modal .dls { display: flex; flex-direction: column; gap: 14px; }

  /* ---------- Lightbox 图片预览 ---------- */
  .lightbox { display: none; position: fixed; inset: 0; z-index: 200; }
  .lightbox.open { display: block; }
  .lb-backdrop { position: absolute; inset: 0; background: rgba(5, 5, 7, 0.85); }
  .lb-close { position: absolute; top: 28px; right: 36px; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(255,255,255,.06); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; z-index: 3; transition: all .2s ease; }
  .lb-close:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); }
  .lb-inner { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 48px; height: 100%; padding: 6vh 6vw; }
  .lb-image-wrap {
    position: relative;
    max-width: min(68vw, 900px);
    max-height: 82vh;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,.5);
    flex-shrink: 0;
    background: #1a1a1a;
    isolation: isolate;
  }
  .lb-image-wrap img {
    width: 100%; height: auto; display: block; max-height: 82vh; object-fit: contain;
    filter: blur(0) saturate(1);
    transform: scale(1);
    transition: filter 0.5s ease, transform 0.5s ease, opacity 0.3s ease;
    opacity: 1;
  }
  /* 加载中状态 */
  .lb-image-wrap.is-loading img {
    filter: blur(14px) saturate(0.4);
    transform: scale(1.06);
    opacity: 0.82;
  }
  /* sweep 光带 */
  .lb-sweep {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.18) 50%, transparent 62%);
    background-size: 260% 100%;
    pointer-events: none;
    opacity: 0;
    z-index: 2;
  }
  .lb-image-wrap.is-loading .lb-sweep {
    opacity: 1;
    animation: lbSweep 2.2s linear infinite;
  }
  @keyframes lbSweep {
    from { background-position: 130% 0; }
    to   { background-position: -130% 0; }
  }
  /* chip 状态标签 */
  .lb-chip {
    position: absolute; bottom: 14px; left: 14px;
    display: inline-flex; align-items: center; gap: 7px;
    height: 26px; padding: 0 10px 0 8px;
    border-radius: 13px;
    background: rgba(20,20,22,.85);
    color: rgba(255,255,255,.9);
    font-size: 12px; font-weight: 500;
    pointer-events: none;
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 3;
  }
  .lb-image-wrap.is-loading .lb-chip { opacity: 1; transform: none; }
  .lb-image-wrap.is-ready .lb-chip { opacity: 0; transform: translateY(4px); transition-delay: 0.8s; }
  .lb-chip-mark {
    width: 13px; height: 13px;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: rgba(255,255,255,.9);
    border-radius: 50%;
    animation: lbSpin 0.9s linear infinite;
  }
  .lb-image-wrap.is-ready .lb-chip-mark {
    animation: none;
    border: none;
    background: #22c55e;
    border-radius: 50%;
    position: relative;
  }
  .lb-image-wrap.is-ready .lb-chip-mark::after {
    content: ""; position: absolute; inset: 3px;
    background: #fff; clip-path: polygon(14% 44%, 34% 64%, 84% 20%, 92% 28%, 36% 76%, 16% 58%);
  }
  @keyframes lbSpin { to { transform: rotate(360deg); } }
  .lb-caption { max-width: 320px; color: rgba(255,255,255,.88); }
  .lb-caption .lb-cat { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.45); margin-bottom: 14px; font-weight: 600; }
  .lb-caption .lb-name { font-family: var(--display); font-size: 40px; font-weight: 600; line-height: 1.08; letter-spacing: -0.02em; }
  .lb-caption .lb-tag { font-size: 15px; color: rgba(255,255,255,.6); margin-top: 12px; font-weight: 500; }
  .lb-caption .lb-desc { font-size: 14px; color: rgba(255,255,255,.55); margin-top: 22px; line-height: 1.7; }
  .lb-caption .lb-divider { width: 36px; height: 2px; background: var(--accent); margin: 24px 0 0; border-radius: 2px; }

  /* ---------- 彩蛋弹窗 ---------- */
  .egg-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 9999;
  }
  .egg-overlay.open { display: flex; }

  .egg-card {
    background: #fff; border-radius: 12px;
    padding: 28px 32px 24px;
    max-width: 360px; width: calc(100% - 48px);
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    animation: eggPopIn .25s ease-out;
  }

  .egg-title {
    font-size: 15px; font-weight: 700;
    color: #1a1a1a; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .egg-title::before {
    content: "🥚"; font-size: 16px;
  }

  .egg-body {
    font-size: 14px; color: #333;
    line-height: 1.8; margin-bottom: 20px;
  }
  .egg-body p { margin: 0 0 6px; }
  .egg-body p:last-child { margin-bottom: 0; }

  .egg-close {
    width: 100%; padding: 10px;
    background: #1a1a1a; color: #fff;
    border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background .15s ease;
  }
  .egg-close:hover { background: #333; }

  @keyframes eggPopIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 下载按钮（下载→安装中→已安装） ---------- */
  .dl-btn {
    background: var(--soft); border: 2px solid #3b82f6;
    display: flex; align-items: center; gap: 14px;
    border-radius: 50px; width: 100%; cursor: pointer;
    transition: transform .18s ease, all .4s ease; padding: 5px; position: relative; box-sizing: border-box;
    transform-style: preserve-3d;
  }
  .dl-btn::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; right: 0;
    background: #3b82f6; width: 8px; height: 8px;
    transition: all .4s ease; border-radius: 100%; margin: auto;
    opacity: 0; visibility: hidden;
  }
  .dl-btn .dl-input { display: none; }
  .dl-btn .dl-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .dl-btn .dl-title {
    font-size: 15px; color: var(--ink); font-weight: 600;
    transition: opacity .3s ease; white-space: nowrap;
  }
  .dl-btn .dl-fname {
    font-size: 11.5px; color: var(--muted); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity .3s ease;
  }
  .dl-btn .dl-installed {
    position: absolute; left: 64px; color: var(--ink); font-size: 15px; font-weight: 600;
    opacity: 0; visibility: hidden; transition: all .4s ease;
  }
  .dl-btn .dl-circle {
    height: 42px; width: 42px; border-radius: 50%; background: #3b82f6;
    display: flex; justify-content: center; align-items: center;
    transition: all .4s ease; position: relative; flex-shrink: 0;
    box-shadow: 0 0 0 0 rgba(255,255,255,0.7); overflow: hidden;
  }
  .dl-btn .dl-circle .dl-icon {
    color: #fff; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); transition: all .4s ease; font-size: 18px; line-height: 1;
  }
  .dl-btn .dl-circle .dl-square {
    aspect-ratio: 1; width: 14px; border-radius: 2px; background: #fff;
    opacity: 0; visibility: hidden; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); transition: all .4s ease;
  }
  .dl-btn .dl-circle::before {
    content: ""; position: absolute; left: 0; top: 0; background: #2563eb;
    width: 100%; height: 0; transition: all .4s ease;
  }

  .dl-btn:has(.dl-input:checked) { width: 57px; animation: installed .4s ease 3.5s forwards; }
  .dl-btn:has(.dl-input:checked)::before { animation: rotate 3s ease-in-out .4s forwards; }
  .dl-btn:has(.dl-input:checked) .dl-text { opacity: 0; visibility: hidden; }
  .dl-btn .dl-input:checked + .dl-circle {
    animation: pulse 1s forwards, circleDelete .2s ease 3.5s forwards;
    rotate: 180deg;
  }
  .dl-btn .dl-input:checked + .dl-circle::before { animation: installing 3s ease-in-out forwards; }
  .dl-btn .dl-input:checked + .dl-circle .dl-icon { opacity: 0; visibility: hidden; }
  .dl-btn .dl-input:checked ~ .dl-circle .dl-square { opacity: 1; visibility: visible; }
  .dl-btn .dl-input:checked ~ .dl-installed { animation: showInstalledMessage .4s ease 3.5s forwards; }

  @keyframes pulse {
    0% { scale: .95; box-shadow: 0 0 0 0 rgba(59,130,246,0.6); }
    70% { scale: 1; box-shadow: 0 0 0 16px rgba(59,130,246,0); }
    100% { scale: .95; box-shadow: 0 0 0 0 rgba(59,130,246,0); }
  }
  @keyframes installing { from { height: 0; } to { height: 100%; } }
  @keyframes rotate {
    0% { transform: rotate(-90deg) translate(25px) rotate(0); opacity: 1; visibility: visible; }
    99% { transform: rotate(270deg) translate(25px) rotate(270deg); opacity: 1; visibility: visible; }
    100% { opacity: 0; visibility: hidden; }
  }
  @keyframes installed { 100% { width: 150px; border-color: rgb(35,174,35); } }
  @keyframes circleDelete { 100% { opacity: 0; visibility: hidden; } }
  @keyframes showInstalledMessage {
    100% { opacity: 1; visibility: visible; color: rgb(35,174,35); }
  }

  .modal .nodl { color: var(--muted); font-size: 14px; line-height: 1.7; }
  .modal .sec ul { list-style: none; }
  .modal .sec li { font-size: 14px; line-height: 1.65; color: var(--muted); margin-bottom: 10px; position: relative; padding-left: 18px; }
  .modal .sec li:last-child { margin-bottom: 0; }
  .modal .sec li::before { content: ""; position: absolute; left: 2px; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  /* ---------- 进页面加载动画 ---------- */
  /* ========== React Bits BounceCards（公告页顶部 fan 堆叠卡片） ========== */
  .bounce-cards {
    position: relative;
    width: 100%;
    height: 280px;
    overflow: visible;
    touch-action: pan-y;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .bounce-cards__card {
    position: absolute;
    top: 35%;
    left: 50%;
    width: var(--bounce-cards-size, 240px);

    pointer-events: none;

  /* 底部名字+分类 */
  .bounce-cards__card .bc-caption {

  /* Preloader — 遮罩层 */
  .preloader {
    position: fixed; inset: 0; z-index: 9999;

  .splash-inner {

  /* 公告页 SlideCommit —— 滑块确认进入主站（React Bits 风格，原生 JS+CSS 移植） */
  /* 公告页 HoldButton —— 液态填充 + crest 波浪 + glow（React Bits 风格，原生 JS+CSS） */
  .splash-hold {
    --hb-radius: 14px;
    --hb-bg: var(--ink);
    --hb-fill: #3b82f6;
    --hb-text: #3b82f6;
    --hb-fill-text: #ffffff;
    --hb-hold: 1500ms;
    --hb-release: 200ms;
    --hb-press: 0.97;
    --hb-wave: 6px;
    --hb-w: 0px; --hb-h: 0px;
    --hb-p: 0;
    --hb-cycles: 1.36;
    --hb-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    --hb-glow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 32px -6px color-mix(in srgb, var(--hb-fill) 70%, transparent);
    position: relative;
    display: inline-grid; place-items: center; isolation: isolate;
    margin: 0; border: 0; border-radius: var(--hb-radius);
    background: var(--hb-bg); color: var(--hb-text);
    font-family: inherit; font-weight: 500; letter-spacing: .01em; line-height: 1;
    box-shadow: var(--hb-shadow); cursor: pointer; outline: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: transform 160ms cubic-bezier(.23,1,.32,1), background-color 160ms ease, box-shadow var(--hb-release) cubic-bezier(.23,1,.32,1);
    width: 100%; height: 52px; padding: 0 28px; font-size: 15px;
  }
  .splash-hold[data-phase="holding"] { transform: scale(var(--hb-press)); }
  .splash-hold[data-phase="holding"], .splash-hold[data-phase="done"] {
    box-shadow: var(--hb-glow);
    transition: transform 160ms cubic-bezier(.23,1,.32,1), background-color 160ms ease, box-shadow var(--hb-hold) linear;
  }
  .splash-hold__pulse { position: absolute; inset: 0; z-index: 0; border-radius: var(--hb-radius); pointer-events: none; opacity: 0; }
  .splash-hold[data-phase="done"] .splash-hold__pulse {
    animation: hb-pulse 600ms cubic-bezier(.23,1,.32,1) forwards;
  }
  @keyframes hb-pulse {
    from { opacity: 1; box-shadow: 0 0 0 0 color-mix(in srgb, var(--hb-fill) 55%, transparent); }
    to   { opacity: 0; box-shadow: 0 0 0 14px color-mix(in srgb, var(--hb-fill) 0%, transparent); }
  }
  .splash-hold__label {
    position: relative; z-index: 2; display: grid; place-items: center;
  }
  .splash-hold__label > span {
    grid-area: 1/1; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    transition: opacity 200ms ease, filter 200ms ease;
  }
  .splash-hold__done { opacity: 0; filter: blur(2px); }
  .splash-hold[data-phase="done"] .splash-hold__idle { opacity: 0; filter: blur(2px); }
  .splash-hold[data-phase="done"] .splash-hold__done { opacity: 1; filter: blur(0); }
  .splash-hold__clip {
    position: absolute; inset: 0; z-index: 3;
    clip-path: inset(0 round var(--hb-radius)); pointer-events: none;
  }
  .splash-hold__fill {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--hb-fill); color: var(--hb-fill-text);
    clip-path: inset(0 calc((1 - var(--hb-p)) * (100% + 0.75 * var(--hb-wave)) - var(--hb-p) * 0.25 * var(--hb-wave)) 0 0);
  }
  .splash-hold__crest {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: var(--hb-fill); color: var(--hb-fill-text);
    -webkit-mask-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2720%27 height=%27200%27 viewBox=%270 0 20 200%27 preserveAspectRatio=%27none%27%3E%3Cpath d=%27M0 0H10C18 8 18 25.3 10 33.3S2 58.7 10 66.7S18 92 10 100S2 125.3 10 133.3S18 158.7 10 166.7S2 192 10 200H0Z%27/%3E%3C/svg%3E");
    -webkit-mask-repeat: repeat-y;
    -webkit-mask-size: var(--hb-wave) calc(var(--hb-h) * 2);
    -webkit-mask-position-x: calc(-1 * var(--hb-wave) + var(--hb-p) * (var(--hb-w) + var(--hb-wave)));
    -webkit-mask-position-y: calc(-1 * var(--hb-p) * var(--hb-cycles) * var(--hb-h));
    mask-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2720%27 height=%27200%27 viewBox=%270 0 20 200%27 preserveAspectRatio=%27none%27%3E%3Cpath d=%27M0 0H10C18 8 18 25.3 10 33.3S2 58.7 10 66.7S18 92 10 100S2 125.3 10 133.3S18 158.7 10 166.7S2 192 10 200H0Z%27/%3E%3C/svg%3E");
    mask-repeat: repeat-y;
    mask-size: var(--hb-wave) calc(var(--hb-h) * 2);
    mask-position-x: calc(-1 * var(--hb-wave) + var(--hb-p) * (var(--hb-w) + var(--hb-wave)));
    mask-position-y: calc(-1 * var(--hb-p) * var(--hb-cycles) * var(--hb-h));
  }
  .splash-hint { text-align: center; font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .splash-hold { transform: none !important; transition: background-color 160ms ease, box-shadow var(--hb-release) ease; }
    .splash-hold__fill { clip-path: inset(0); opacity: 0; transition: opacity var(--hb-release) ease; }
    .splash-hold__crest { display: none; }
    .splash-hold[data-phase="holding"] .splash-hold__fill, .splash-hold[data-phase="done"] .splash-hold__fill { opacity: 1; transition: opacity var(--hb-hold) linear; }
    .splash-hold__pulse { animation: none !important; }
    .splash-hold__label > span { filter: none !important; }
  }
  @media (max-width: 720px) { .splash-hold { height: 46px; font-size: 13px; padding: 0 22px; } }


  @media (max-width: 720px) {

<script>
(function () {
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  function shade(hex, f) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    var r = Math.min(255, Math.round(((n >> 16) & 255) * f));
    var g = Math.min(255, Math.round(((n >> 8) & 255) * f));
    var b = Math.min(255, Math.round((n & 255) * f));
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  if (SITE.accent) {
    document.documentElement.style.setProperty("--accent", SITE.accent);
    document.documentElement.style.setProperty("--accent-deep", shade(SITE.accent, 0.84));
  }

  // 主题切换
  var themeToggle = document.querySelector(".theme-switch__checkbox");
  var savedTheme = localStorage.getItem("store-theme") || "auto";
  var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  themeToggle.checked = savedTheme === "dark" || (savedTheme === "auto" && sysDark);
  document.documentElement.setAttribute("data-theme", themeToggle.checked ? "dark" : "light");
  themeToggle.addEventListener("change", function () {
    var t = themeToggle.checked ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem("store-theme", t);
  });

  document.title = SITE.name;
  var brandName = document.getElementById("brand-name");
  if (brandName) brandName.textContent = SITE.name;

  var header = document.querySelector("header");
  function onScroll() {
    if (window.scrollY > 8) header.classList.add("scrolled");
    else header.classList.remove("scrolled");
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // 控制台彩蛋：页面一加载就打
  console.log("%c👋 欢迎来到 Chovy Store", "font-size:20px;color:#f5491f;font-weight:bold;");
  console.log("%c想看点有意思的？连点屏幕任意位置 5 下试试。", "font-size:13px;color:#888;");
  console.log("%c或者你就是个喜欢看控制台的人，那我们是同类。", "font-size:12px;color:#aaa;font-style:italic;");

  var bmEl = document.getElementById("branched-menu");
  var listEl = document.getElementById("list");
  var qEl = document.getElementById("q");

  // 滚动加载状态
  var PAGE_SIZE = 8;
  var pageIndex = 0;
  var fullList = [];
  var __loadingMore = false;

  // 浮动标签：每个字逐个上移
  var qLabel = document.getElementById("q-label");
  var ph = "搜索应用…";
  qLabel.innerHTML = ph.split("").map(function (ch, i) {
    return '<span style="transition-delay:' + (i * 50) + 'ms">' + esc(ch) + '</span>';
  }).join("");

  var categories = CATEGORIES.slice();
  // 兜底：如果有应用的 category 不在 CATEGORIES 里，也补上显示
  APPS.forEach(function (a) {
    if (categories.indexOf(a.category) === -1) categories.push(a.category);
  });

  var active = "最近上架";
  var query = "";
  // 自动检测访客操作系统；手动切换过则优先手动选择（虚拟机等场景可随时点按钮改）
  function detectPlatform() {
    var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.userAgent || "";
    return /mac|iphone|ipad|ipod/i.test(p) ? "mac" : "win";
  }
  var platform = localStorage.getItem("store-platform") || detectPlatform();

  // 平台选择：拟物拨杆开关（选中 = macOS）
  var platCb = document.getElementById("plat-toggle");
  var platNow = document.getElementById("plat-now");
  function updatePlatNote() {
    if (platNow) {
      platNow.textContent = platform === "mac"
        ? "您现在下载 macOS 的软件"
        : "您现在下载 Windows 的软件";
    }
  }
  function setPlatform(p) {
    platform = p;
    localStorage.setItem("store-platform", platform);
    if (platCb) platCb.checked = platform === "mac";
    updatePlatNote();
    buildBranchedMenu();
    renderList();
  }
  if (platCb) {
    platCb.addEventListener("change", function () {
      setPlatform(platCb.checked ? "mac" : "win");
    });
    platCb.checked = platform === "mac";
  }
  updatePlatNote();

  function filteredDownloads(app) {
    if (!app.downloads || !app.downloads.length) return [];
    var key = platform === "mac" ? /mac/i : /windows/i;
    var matched = app.downloads.filter(function (d) { return key.test(String(d.platform || "")); });
    // 应用里明确标了 mac/windows 的下载项 → 严格按当前平台过滤
    // 应用里一个 mac/windows 都没有（通用工具，如油猴脚本）→ 全部返回
    var hasAnyMacWin = app.downloads.some(function (d) {
      return /mac|windows/i.test(String(d.platform || ""));
    });
    return hasAnyMacWin ? matched : app.downloads.slice();
  }

  // ---------- 简化版 Dock 分类栏（纯 innerHTML，无物理系统） ----------
  var catCounts = {};
  function recalcCounts() {
    var byPlatform = APPS.filter(function (a) { return filteredDownloads(a).length > 0; });
    catCounts = {};
    byPlatform.forEach(function (a) { catCounts[a.category] = (catCounts[a.category] || 0) + 1; });
    catCounts["最近上架"] = byPlatform.length;
  }
  recalcCounts();

  // ===== React Bits BranchedMenu — 原生 JS 完整移植（1:1 源码） =====
  var BM_PAD = 6;
  var BM_MARK = 14;
  var BM_ROW = 42;
  var BM_INDENT = 32;
  var BM_TRUNK = 12;
  var BM_RADIUS = 9;
  var BM_LINE_W = 1.5;
  var BM_ENDX = BM_INDENT - 6;

  // 分组数据 — 浏览 + 分类
  var bmSections = [
    {
      label: "浏览",
      children: [{ value: "最近上架", label: "最近上架" }]
    },
    {
      label: "分类",
      children: categories.map(function (c) { return { value: c, label: c }; })
    }
  ];
  // 默认展开：浏览(0) + 分类(1) 都展开；默认激活：最近上架
  var bmOpen = new Set([0, 1]);
  // 取第一个打开 section 的第一个 child 作为默认 active
  var bmActive = "最近上架";
  var bmHeads = [];
  var bmMarker = null;
  var bmRO = null;

  // SVG path 几何公式（1:1 从 React 源码移植）
  var bmR = Math.min(BM_RADIUS, BM_ROW / 2 - 2);
  function bmRowY(k) { return BM_PAD + k * BM_ROW + BM_ROW / 2; }
  function bmBranch(k) {
    return "M " + BM_TRUNK + " " + (bmRowY(k) - bmR) +
      " A " + bmR + " " + bmR + " 0 0 0 " + (BM_TRUNK + bmR) + " " + bmRowY(k) +
      " H " + BM_ENDX;
  }
  function bmReach(k) {
    return "M " + BM_TRUNK + " 0" +
      " V " + (bmRowY(k) - bmR) +
      " A " + bmR + " " + bmR + " 0 0 0 " + (BM_TRUNK + bmR) + " " + bmRowY(k) +
      " H " + BM_ENDX;
  }
  function bmLength(k) { return bmRowY(k) - bmR + (Math.PI * bmR) / 2 + (BM_ENDX - BM_TRUNK - bmR); }

  function placeMarker(glide) {
    if (!bmMarker) return;
    var activeSection = -1;
    bmSections.forEach(function (sec, si) {
      if (sec.children && sec.children.some(function (kid) { return kid.value === bmActive; })) {
        activeSection = si;
      }
    });
    var markerShown = activeSection >= 0 && bmOpen.has(activeSection);
    var head = bmHeads[activeSection];
    if (!glide) bmMarker.style.transition = "none";
    if (markerShown && head) {
      bmMarker.style.top = (head.offsetTop + (head.offsetHeight - BM_MARK) / 2) + "px";
    }
    if (markerShown) bmMarker.setAttribute("data-on", ""); else bmMarker.removeAttribute("data-on");
    if (!glide) {
      void bmMarker.offsetHeight;
      bmMarker.style.transition = "";
    }
  }

  function buildBranchedMenu() {
    if (!bmEl) return;
    recalcCounts();

    var html = '<span class="branched-menu__marker" aria-hidden="true"></span>';
    bmSections.forEach(function (sec, si) {
      var kids = sec.children;
      var isOpen = kids ? bmOpen.has(si) : false;
      html += '<div class="branched-menu__section' + (isOpen ? '" data-open=""' : '"') + '">';
      html += '<button type="button" class="branched-menu__head" data-si="' + si + '" aria-expanded="' + (kids ? isOpen : "false") + '">';
      html += esc(sec.label);
      html += '</button>';
      if (kids) {
        var bodyH = BM_PAD * 2 + kids.length * BM_ROW;
        html += '<div class="branched-menu__body"><div class="branched-menu__fold">';
        html += '<div class="branched-menu__tree" style="height:' + bodyH + 'px">';
        html += '<svg class="branched-menu__lines" width="' + BM_INDENT + '" height="' + bodyH + '" aria-hidden="true">';
        // 树干（灰色）：从 trunk 到最后一个 kid 的 rowY - r
        html += '<path class="branched-menu__base" d="M ' + BM_TRUNK + ' 0 V ' + (bmRowY(kids.length - 1) - bmR) + '"/>';
        // 每个 kid 的 branch（灰色弧 + 横线）
        kids.forEach(function (kid, k) {
          html += '<path class="branched-menu__base" d="' + bmBranch(k) + '"/>';
        });
        // 每个 kid 的 reach（橙色动画线）
        kids.forEach(function (kid, k) {
          var len = bmLength(k);
          var isActive = kid.value === bmActive;
          html += '<path class="branched-menu__reach" d="' + bmReach(k) + '" style="stroke-dasharray:' + len + ';stroke-dashoffset:' + (isActive ? 0 : len) + '"/>';
        });
        html += '</svg>';
        // 每个 kid 的 item
        kids.forEach(function (kid) {
          html += '<button type="button" class="branched-menu__item' + (kid.value === bmActive ? '" data-active=""' : '"') + '" data-value="' + esc(kid.value) + '" aria-current="' + (kid.value === bmActive ? "true" : "false") + '">';
          html += '<span class="branched-menu__label">' + esc(kid.label) + '</span>';
          html += '</button>';
        });
        html += '</div></div></div>';
      }
      html += '</div>';
    });
    bmEl.innerHTML = html;

    // 保存 heads 引用
    bmHeads = [];
    bmEl.querySelectorAll(".branched-menu__head").forEach(function (h) {
      bmHeads.push(h);
      h.addEventListener("click", function () {
        var si = parseInt(h.getAttribute("data-si"), 10);
        var isOpenNow = bmOpen.has(si);
        if (isOpenNow) bmOpen.delete(si); else bmOpen.add(si);
        buildBranchedMenu(); // 重建 DOM 刷 state（包含 SVG reach 线的 dashoffset 动画）
        renderList();
      });
    });

    // marker 引用
    bmMarker = bmEl.querySelector(".branched-menu__marker");

    // item 点击
    bmEl.querySelectorAll(".branched-menu__item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        bmActive = btn.getAttribute("data-value");
        active = bmActive;
        buildBranchedMenu(); // 重建以更新 marker 位置 + reach 线
        renderList();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    // ResizeObserver 跟随 marker
    if (bmRO) bmRO.disconnect();
    bmRO = new ResizeObserver(function () { placeMarker(false); });
    bmRO.observe(bmEl);

    placeMarker(true);
  }

  function iconHtml(a, cls) {
    if (a.icon) return '<img class="' + cls + '" src="' + esc(a.icon) + '" alt="" loading="lazy" decoding="async">';
    return '<div class="' + cls + ' avatar">' + esc((a.name || "?").charAt(0)) + "</div>";
  }

  function platOf(a) {
    if (!a.downloads || !a.downloads.length) return "";
    var ps = [];
    a.downloads.forEach(function (d) {
      var p = String(d.platform || "");
      if (/windows/i.test(p) && ps.indexOf("Windows") === -1) ps.push("Windows");
      else if (/mac/i.test(p) && ps.indexOf("macOS") === -1) ps.push("macOS");
      else if (/linux/i.test(p) && ps.indexOf("Linux") === -1) ps.push("Linux");
      else if (/android/i.test(p) && ps.indexOf("Android") === -1) ps.push("Android");
      else if (p && ps.indexOf(p) === -1) ps.push(p);
    });
    return ps.join(" · ");
  }

  function cardHtml(a) {
    var platDls = filteredDownloads(a);

    var preview = a.preview || "";
    return (
      '<div class="card" role="button" tabindex="0" data-id="' + esc(a.id) + '" data-tc>' +
        (preview ? '<div class="c-preview"><img src="' + esc(preview) + '" alt="" loading="eager" decoding="async" fetchpriority="auto" onload="this.classList.add(\'loaded\');this.closest(\'.c-preview\')?.classList.add(\'loaded\')"><div class="c-preview-hint"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.3-4.3"/></svg>点击预览</div></div>' : "") +
        '<div class="c-row">' +

          '<div class="c-body">' +
            '<div class="c-name">' + esc(a.name) + "</div>" +
            '<div class="c-meta-row">' +

            "</div>" +

        '<div class="card__shadow" aria-hidden="true"></div><span class="card__glare" aria-hidden="true"></span><span class="card__rim" aria-hidden="true"></span><span class="card__edge" aria-hidden="true"></span>' +
      "</div>"
    );
  }

  function matches(a) {
    if (active !== "最近上架" && a.category !== active) return false;
    if (!filteredDownloads(a).length) return false;
    if (!query) return true;
    var hay = [a.name, a.tagline, a.description, a.category].join(" ").toLowerCase();

  // scroll + 定时兜底（某些环境 scroll 事件不冒泡）
  var __scrollTimer = null;
  function checkScroll() {
    clearTimeout(__scrollTimer);
    __scrollTimer = setTimeout(function () {
      var sentinel = document.getElementById("scroll-sentinel");
      if (sentinel && !__loadingMore) {
        var r = sentinel.getBoundingClientRect();

          setTimeout(function () { __loadingMore = false; }, 600);

  }
  window.addEventListener("scroll", checkScroll, { passive: true });
  setInterval(checkScroll, 1500);

  // ======== 时间格式 + 新鲜度分类 ========
  function timeAgo(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var ms = now - d;
    var mins = ms / 60000, hrs = ms / 3600000, days = ms / 86400000;
    if (ms < 0) return "刚上架";
    if (days < 1) {
      if (hrs < 1) return Math.max(1, Math.round(mins)) + "分钟前";
      return Math.max(1, Math.round(hrs)) + "小时前";
    }
    if (days < 7) return Math.round(days) + "天前";
    if (days < 30) return Math.round(days / 7) + "周前";
    if (days < 365) return Math.round(days / 30) + "个月前";
    return Math.round(days / 365) + "年前";
  }
  function classifyFresh(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    if (isNaN(d.getTime())) return "slate";
    var days = (new Date() - d) / 86400000;
    if (days < 1)  return "brand-new";   // 品牌橙（今天）
    if (days < 4)  return "coral";       // 珊瑚红（2-3天）
    if (days < 7)  return "tangerine";   // 深橙（4-7天）
    if (days < 14) return "sky";          // 天蓝（1-2周）
    if (days < 30) return "deep-blue";    // 深蓝（2-4周）
    if (days < 90) return "slate";        // 蓝灰（1-3月）
    return "ink-muted";                   // 近黑（3月+）
  }
  function fillDates(root) {
    (root || document).querySelectorAll(".c-date[data-date]").forEach(function (el) {
      var d = el.getAttribute("data-date");
      if (!d) return;
      if (el.getAttribute("data-fresh")) return;
      var fresh = classifyFresh(d);
      el.setAttribute("data-fresh", fresh);
      el.textContent = timeAgo(d);
    });
  }

  function renderList(skipFade) {
    var list = APPS.filter(matches);
    list = list.slice().sort(function (a, b) {
      return (a.date || "0000-00-00").localeCompare(b.date || "0000-00-00");
    });
    if (active === "最近上架" && !query) {
      list = list.slice().reverse();
    }
    fullList = list;
    pageIndex = 0;

    if (skipFade) {
      loadMore(true);
      return;
    }
    // 切换过渡：旧内容上飘消失 → 重建 → 新内容下浮出现
    var _t = "transform .2s ease, opacity .2s ease-out";
    listEl.style.transition = _t;
    listEl.style.willChange = "transform, opacity";
    listEl.style.transform = "translateY(-12px)";
    listEl.style.opacity = "0";
    setTimeout(function () {
      listEl.style.transition = "none";
      loadMore(true);
      // 新内容初始：在下方 14px + 透明
      listEl.style.transform = "translateY(14px)";
      listEl.style.opacity = "0";
      // 强制一帧重排后加 transition
      void listEl.offsetHeight;
      listEl.style.transition = _t;
      listEl.style.transform = "translateY(0)";
      listEl.style.opacity = "1";
      setTimeout(function () {
        listEl.style.transition = "";
        listEl.style.willChange = "";
      }, 240);
    }, 220);
  }

  function loadMore(reset) {
    if (reset) {
      var html = "";
      if (active === "最近上架" && !query) {
        html = '<div class="group-title">最近上架 <span class="gt-count">' + fullList.length + "</span></div>";
      } else {
        html = '<div class="group-title"><span class="gt-count">' + fullList.length + "</span></div>";
      }
      html += '<div class="grid" id="card-grid"></div>';
      html += '<div class="sentinel" id="scroll-sentinel"><div class="load-dots"><span></span><span></span><span></span></div></div>';
      html += '<div class="end-hint" id="end-hint" style="display:none;text-align:center;padding:24px;color:var(--muted);font-size:12px;"></div>';
      listEl.innerHTML = html;
    }
    var grid = document.getElementById("card-grid");
    var start = pageIndex * PAGE_SIZE;
    var end = Math.min(start + PAGE_SIZE, fullList.length);
    var batch = fullList.slice(start, end);
    if (reset && !batch.length) {
      listEl.innerHTML = '<div class="empty">' +
        (query ? "没找到相关的应用" : "这个分类下还没有应用") +
        '<div class="hint">' + (query ? "换个关键词试试" : "看看其他分类") + "</div></div>";
      return;
    }
    if (!reset && !batch.length) {
      return;
    }
    batch.forEach(function (a) { grid.insertAdjacentHTML("beforeend", cardHtml(a)); });
    fillDates(grid);
    pageIndex++;

    if (!reset) checkScroll();

    var sentinel = document.getElementById("scroll-sentinel");
    var endHint = document.getElementById("end-hint");
    if (end >= fullList.length) {
      if (sentinel) sentinel.style.display = "none";
      if (endHint) {
        endHint.style.display = "block";
        endHint.textContent = "—— 全部 " + fullList.length + " 个应用已加载 ——";
      }
      return;

    // reset=true 时 setTimeout 错峰已经处理了，不要再调 checkScroll 抢白
    // reset=false 时需要 checkScroll 处理无限滚动新加载的卡
    if (!reset) checkScroll();
  }

  var qTimer = null;

  // ======== TiltedCard — 3D 倾斜（最简直接版） ========
  // 必须在 renderList(true) 之后运行
  (function () {
    function bindOne(card) {
      if (card._tcBound) return;
      card._tcBound = true;

      var AMP = 10, GLARE = 0.4, SHADOW = 0.4, PARALLAX = 1;

      function onMove(e) {
        var rect = card.getBoundingClientRect();

  (function initBounceCards() {
    var root = document.getElementById("bounce-cards");
    if (!root) return;

    // 从 APPS 取最新 5 个应用（按日期降序）
    var sorted = APPS.slice().sort(function (a, b) {
      return (b.date || "").localeCompare(a.date || "");
    });
    var top5 = sorted.slice(0, 5);

    var PATTERN = [1, 0.5, -0.3, -1, 0.2, 0.75, -0.6, 0.35, -0.85, 0.1];

    // 参数（按用户给的配置）
    var cfg = {
      cardSize: 260,
      spread: 130,
      rotation: 12,
      arc: 80,
      animationDelay: 0.4,
      animationStagger: 0.06,
      bounciness: 0.6,
      enableHover: true,
      pushDistance: 160,
      hoverScale: 1.06,
      borderWidth: 0,
      borderColor: "transparent",
      radius: 25,
      shadow: true
    };
    var cardSize = cfg.cardSize;
    var count = top5.length;
    var middle = (count - 1) / 2;
    var reach = Math.max(1, middle);

    // 计算每个 card 的目标 slot
    var slots = top5.map(function (_, i) {
      var offset = i - middle;
      return {
        x: offset * cfg.spread,
        y: cfg.arc * Math.pow(offset / reach, 2),
        rotate: cfg.rotation * PATTERN[i % PATTERN.length]

    root.style.setProperty("--bounce-cards-border", cfg.borderWidth + "px");
    root.style.setProperty("--bounce-cards-border-color", cfg.borderColor);
    root.style.setProperty("--bounce-cards-radius", cfg.radius + "px");
    root.style.setProperty("--bounce-cards-shadow", cfg.shadow ? "0 1px 2px rgba(0,0,0,.12), 0 10px 28px -6px rgba(0,0,0,.32)" : "none");
    root.style.setProperty("--bounce-cards-shadow-active", cfg.shadow ? "0 2px 4px rgba(0,0,0,.14), 0 22px 44px -10px rgba(0,0,0,.42)" : "none");

    var cardRefs = [];
    top5.forEach(function (app, i) {
      var el = document.createElement("div");
      el.className = "bounce-cards__card";
      el.style.zIndex = String(i + 1);
      var iconBg = app.icon
        ? '<img class="bc-img" src="' + esc(app.icon) + '" alt="" loading="lazy">'
        : "";
      var avatar = !app.icon
        ? '<div class="bc-avatar">' + esc((app.name || "?").charAt(0)) + '</div>'

          '<div class="bc-cat">' + esc(app.category || "") + '</div>' +

        var targetY = slot.y;

    "<p>你是今天第 3 个触发这个彩蛋的人。<br>前两个没看到这条，因为随机。<br><span style='color:#f5491f'>你运气不错。</span></p>",

    "<p>这个站部署在 Cloudflare Pages 上，全球 300+ 节点。<br>所以不管你在哪，打开都很快。<br>除了 GitHub 直链下载那个环节。</p>",
    "<p>我写代码的座右铭是：<br>能跑就行，先别重构。<br><span style='color:#f5491f'>后来发现这是真理。</span></p>",
    "<p>你有没有想过，为什么彩蛋都藏得那么深？<br>因为<span style='color:#f5491f'>容易被发现的就不叫彩蛋了</span>。</p>",

    "<p>你知道吗，这个彩蛋的弹窗我改了至少 8 次样式。<br>从复杂到简单，又从简单到复杂，最后砍成现在这样。<br>设计就是<span style='color:#f5491f'>先做减法，再减到不能减</span>。</p>",

  ];
  var _lastEggIdx = -1;

  // 彩蛋入口：只有系统切换 + 主题切换 5 下触发
  (function () {
    var taps = 0, tapTimer = null, _hint = null;
    var downX = 0, downY = 0, targetEl = null;
    var MOVE_THRESHOLD = 5;
    var EGG_TARGETS = ["plat-toggle", "plat-toggle + .label", ".theme-switch__checkbox"];

    function isEggTarget(el) {
      if (!el) return false;
      if (el.id === "plat-toggle") return true;
      if (el.classList && el.classList.contains("theme-switch__checkbox")) return true;
      // label wrapping the checkbox
      if (el.tagName === "LABEL" && el.getAttribute("for") === "plat-toggle") return true;
      // parent traversal for theme-switch wrapper clicks
      var p = el;
      for (var i = 0; i < 3 && p; i++) {
        if (p.classList && p.classList.contains("theme-switch")) return true;
        p = p.parentElement;
      }
      return false;
    }

    function showHint(txt) {
      if (!_hint) {
        _hint = document.createElement("div");
        _hint.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:99999;pointer-events:none;opacity:0;transition:opacity .2s ease;letter-spacing:.02em;";
        document.body.appendChild(_hint);
      }
      _hint.textContent = txt; _hint.style.opacity = "1";
      clearTimeout(_hint._hide);
      _hint._hide = setTimeout(function () { _hint.style.opacity = "0"; }, 700);
    }

    document.addEventListener("pointerdown", function (e) {
      if (!isEggTarget(e.target)) return;
      downX = e.clientX; downY = e.clientY; targetEl = e.target;
    });
    document.addEventListener("pointerup", function (e) {
      if (!targetEl) return;
      if (!isEggTarget(targetEl)) { targetEl = null; return; }
      var dx = e.clientX - downX, dy = e.clientY - downY;
      targetEl = null;
      if (Math.hypot(dx, dy) > MOVE_THRESHOLD) return;  // 拖拽不算
      taps++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(function () { taps = 0; if (_hint) _hint.style.opacity = "0"; }, 1500);
      if (taps >= 3 && taps < 5) showHint("还差 " + (5 - taps) + " 下 🎯");
      if (taps >= 5) {
        taps = 0; if (_hint) _hint.style.opacity = "0";
        var idx = Math.floor(Math.random() * EASTER_EGGS.length);
        if (idx === _lastEggIdx) idx = (idx + 1) % EASTER_EGGS.length;
        _lastEggIdx = idx;
        document.getElementById("egg-body").innerHTML = EASTER_EGGS[idx];
        document.getElementById("egg").classList.add("open");
        console.log("%c🎂 你发现了彩蛋！", "font-size:28px;color:#f5491f;font-weight:bold;");
      }
    });

    document.getElementById("egg-close").addEventListener("click", function () {
      document.getElementById("egg").classList.remove("open");
    });
    document.getElementById("egg").addEventListener("click", function (e) {
      if (e.target.id === "egg") document.getElementById("egg").classList.remove("open");
    });
  })();



})();
</script>
